<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan with Sundi</title>
<meta name="description" content="Plan with Sundi. More to see here shortly.">
<link rel="canonical" href="https://planwithsundi.com/">
<meta name="theme-color" content="#fff1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121014" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Plan with Sundi">
<meta property="og:description" content="More to see here shortly.">
<meta property="og:url" content="https://planwithsundi.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
/* Homepage: one card centered in the middle of the screen. */
body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: 2rem; }
main { width: 100%; }
.note {
  position: relative; text-align: center;
  background: var(--card); border: 3px solid var(--line); border-radius: 1.5rem;
  padding: 2.25rem 1.5rem 2rem; box-shadow: 5px 5px 0 var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: .75rem;
}
.note .sparkle {
  position: absolute; top: -1.1rem; right: 1.25rem; transform: rotate(8deg);
  width: 2.6rem; height: 2.6rem; display: grid; place-items: center;
  background: var(--mint); color: #3b1530; font-size: 1.3rem;
  border: 3px solid var(--line); border-radius: 50%; box-shadow: 3px 3px 0 var(--shadow);
}
.note p {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(1.5rem, 6vw, 2.1rem); line-height: 1.15; text-wrap: balance; color: var(--title, var(--ink));
}
.dots { display: flex; gap: .5rem; }
.dots span { width: .7rem; height: .7rem; border-radius: 50%; border: 2px solid var(--line); animation: bob 1.4s ease-in-out infinite; }
.dots span:nth-child(1) { background: var(--pink); }
.dots span:nth-child(2) { background: var(--sun); animation-delay: .15s; }
.dots span:nth-child(3) { background: var(--lilac); animation-delay: .3s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .dots span { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="kicker">Hi, I'm Sundi</span>
    <h1>Plan with Sundi</h1>
  </header>
  <div class="note">
    <span class="sparkle" aria-hidden="true">✦</span>
    <p>More to see here shortly</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
</main>
</body>
</html>
